name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        
    - run: flutter pub get
    
    # دروستکردنی فایلی IPA بێ واژۆی توندی پەرەپێدەر (Development build)
    - run: flutter build ios --release --no-codesign
    
    # کۆکردنەوە و ئامادەکردنی بۆ داگرتن
    - run: |
        cd build/ios/iphoneos
        mkdir Payload
        cd Payload
        ln -s ../Runner.app
        cd ..
        zip -r app-release.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: app-release-ipa
        path: build/ios/iphoneos/app-release.ipa
