workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build ios
        scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build ios
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa

triggers:
  publishing: false
  events:
    - push
  branch_patterns:
    - pattern: main
      include: true